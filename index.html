<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>靜心木魚 - 禪詩翻牌考驗</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div id="game-screen" class="screen hidden">
       
        <!-- ✅ 新增：左右排列的容器 -->
        <div id="main-layout">

            <!-- ✅ 左欄：控制區 -->
            <div id="control-panel">
                <header>
                    <h2>禪詩翻牌考驗</h2>
                </header>
                <div id="row1">
                    <div id="timer-box">
                        <span id="timer">20:00</span> 
                    </div>
                    <div id="info-box">
                        分數
                        <div id="score">0</div>
                    </div>
                        
                </div>
                
                <div id="hint-board">
                    
                </div>


                <div id="interact-box">
                    
                    <img id="image" src="video.gif" alt="Meditation Image">
                </div>
                
                

                <button id="hint-btn">
                    開始遊戲
                </button>
                
                
            </div>

            <!-- ✅ 右欄：卡牌區 -->
            <div id="game-panel">
      
                <div class="grid-wrapper">
                     <div id="grid" class="grid">
                        <div id="card-grid">
                            <script src="script.js"></script>
                        </div>
                    </div>
                <div>
            </div>
                
            </div>
            <div> 
        </div>

    </div>

    
</body>
</html>
